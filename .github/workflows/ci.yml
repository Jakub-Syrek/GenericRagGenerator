name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + types + tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.8.4 mypy==1.13.0 "bandit[toml]==1.8.0" pip-audit==2.7.3

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Bandit (security)
        run: bandit -c pyproject.toml -r backend

      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit
        # Allowed to soft-fail: LlamaIndex pulls a large dependency tree whose
        # advisories we can't always unilaterally resolve. Findings still show
        # in the action log so we can react when they appear.
        continue-on-error: true

      - name: Pytest (unit only)
        run: pytest -m "not integration"
