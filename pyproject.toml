[project]
name = "generic-rag-generator"
version = "0.1.0"
description = "Local RAG application backed by Ollama, ChromaDB and LlamaIndex."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend"]
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "C90",
]
ignore = [
    "B008",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]
"smoke_test.py" = []
"eval/**/*.py" = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 30

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "data", "eval", "frontend"]
# B101: asserts in tests are intentional; we already exclude tests, this is belt-and-braces.
skips = ["B101"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = "backend"
files = ["backend"]
