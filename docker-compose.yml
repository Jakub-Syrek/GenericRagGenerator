services:
  ollama:
    image: ollama/ollama:latest
    container_name: ggrag-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ggrag-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ggrag-app
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      APP_HOST: "0.0.0.0"
      CHROMA_DIR: "/data/chroma"
      UPLOAD_DIR: "/data/uploads"
      CORS_ORIGINS: '["http://localhost:8000"]'
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data
    networks:
      - ggrag-net
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/app/.cache:size=32m,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

volumes:
  ollama-data:
    name: ggrag-ollama-data
  app-data:
    name: ggrag-app-data

networks:
  ggrag-net:
    name: ggrag-net
    driver: bridge
